name: Whoop snapshot

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    concurrency:
      group: whoop-snapshot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Restore tokens file from secrets
        run: |
          cat > .whoop-tokens.json <<EOF
          {
            "access_token": "${{ secrets.WHOOP_ACCESS_TOKEN }}",
            "refresh_token": "${{ secrets.WHOOP_REFRESH_TOKEN }}",
            "expires_at": 0
          }
          EOF

      - name: Run snapshot
        env:
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: bun run lib/whoop/snapshot.ts

      - name: Persist rotated tokens back to secrets
        env:
          GH_TOKEN: ${{ secrets.WHOOP_ACTIONS_PAT }}
        run: |
          NEW_REFRESH=$(jq -r .refresh_token .whoop-tokens.json)
          NEW_ACCESS=$(jq -r .access_token .whoop-tokens.json)
          gh secret set WHOOP_REFRESH_TOKEN -b "$NEW_REFRESH"
          gh secret set WHOOP_ACCESS_TOKEN -b "$NEW_ACCESS"

      - name: Commit snapshot
        run: |
          if [[ -n "$(git status --porcelain data/whoop/latest.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/whoop/latest.json
            git commit -m "chore(whoop): refresh stats snapshot"
            git push
          else
            echo "No changes to commit"
          fi
